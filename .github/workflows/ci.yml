name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HomeStock.slnx

      - name: Build (warnings as errors)
        run: dotnet build HomeStock.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test HomeStock.slnx -c Release --no-build --verbosity normal
