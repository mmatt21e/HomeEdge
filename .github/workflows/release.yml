name: Release

# Publishing a version tag (e.g. v0.2.0) builds self-contained installers for every platform,
# builds and pushes a Docker image, and creates a GitHub Release with downloadable assets:
# the installer/upgrader can then fetch them. Also runnable manually for a dry run.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0) for a manual dry run'
        required: false
        default: '0.0.0-manual'

permissions:
  contents: write   # create releases
  packages: write   # push to GHCR

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build all platform artifacts
        run: |
          chmod +x scripts/publish-all.sh
          scripts/publish-all.sh "${{ steps.ver.outputs.version }}" artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homestock-${{ steps.ver.outputs.version }}
          path: artifacts/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## HomeStock ${{ github.ref_name }}

            Self-hosted home inventory. Download a build for your platform below, or use the
            one-command installer:

            **Linux / macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.sh | bash
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/install.ps1 | iex
            ```

            **Docker**
            ```bash
            docker run -d -p 8080:8080 -v homestock-data:/data \
              -e Seed__AdminPassword=change-me \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Upgrade an existing install later with `upgrade.sh` (Linux/macOS) or by re-running the
            installer. Your data is preserved and migrations apply automatically on startup.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=ghcr.io/${REPO_LC}:${GITHUB_REF_NAME},ghcr.io/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${REPO_LC}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
