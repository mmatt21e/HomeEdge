<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeStock — Offline</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b1120; color: #e2e8f0;
               display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 1.5rem; }
        .card { max-width: 22rem; }
        h1 { color: #2dd4bf; font-size: 1.4rem; }
        p { color: #94a3b8; line-height: 1.5; }
        button { margin-top: 1rem; background: #0d9488; color: #fff; border: 0;
                 padding: .7rem 1.4rem; border-radius: .6rem; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You’re offline</h1>
        <p>HomeStock needs a connection to your home server to view and edit inventory.
           Reconnect to your network and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
