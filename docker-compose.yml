# HomeStock — local network deployment.
#
#   1. Copy .env.example to .env and set a strong HOMESTOCK_ADMIN_PASSWORD.
#   2. docker compose up -d --build
#   3. Open http://<this-machine-ip>:8080  (or http://homestock.local:8080 if mDNS resolves)
#
# The SQLite database and uploaded attachments are stored in the named volume `homestock-data`
# (mounted at /data), so they survive container rebuilds. The database is NOT exposed on the
# network — only the HTTP port is published.

services:
  homestock:
    build:
      context: .
      dockerfile: Dockerfile
    image: homestock:latest
    container_name: homestock
    restart: unless-stopped
    ports:
      # host:container — change the host port here if 8080 is taken.
      - "${HOMESTOCK_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Database provider: Sqlite (default) or Postgres.
      Database__Provider: "${HOMESTOCK_DB_PROVIDER:-Sqlite}"
      ConnectionStrings__DefaultConnection: "${HOMESTOCK_DB_CONNECTION:-Data Source=/data/homestock.db;Cache=Shared}"
      Storage__AttachmentsPath: "/data/attachments"
      # First-run admin account. Password comes from .env — never hardcode it here.
      Seed__AdminEmail: "${HOMESTOCK_ADMIN_EMAIL:-admin@homestock.local}"
      Seed__AdminPassword: "${HOMESTOCK_ADMIN_PASSWORD:-}"
      # Trusted reverse-proxy IPs (comma-separated) for future remote access; empty by default.
      ReverseProxy__KnownProxies__0: "${HOMESTOCK_TRUSTED_PROXY:-}"
      # Optional AI photo->inventory (any OpenAI-compatible vision endpoint). Blank = disabled.
      Vision__BaseUrl: "${Vision__BaseUrl:-}"
      Vision__Model: "${Vision__Model:-}"
      Vision__ApiKey: "${Vision__ApiKey:-}"
      Vision__RequireApiKey: "${Vision__RequireApiKey:-true}"
      # Optional AI project planner (reuses the Vision provider if only a text Model is set).
      Planner__BaseUrl: "${Planner__BaseUrl:-}"
      Planner__Model: "${Planner__Model:-}"
      Planner__ApiKey: "${Planner__ApiKey:-}"
      Planner__RequireApiKey: "${Planner__RequireApiKey:-true}"
    volumes:
      - homestock-data:/data
      - ./deploy/backups:/backups
    # ---- Hardening ----
    # The app writes only to the /data volume and /tmp, so the container root can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- Optional PostgreSQL (opt-in). Enable with:  docker compose --profile postgres up -d ----
  # Then set in .env:
  #   HOMESTOCK_DB_PROVIDER=Postgres
  #   HOMESTOCK_DB_CONNECTION=Host=postgres;Database=homestock;Username=homestock;Password=<pw>
  postgres:
    image: postgres:17-alpine
    container_name: homestock-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: homestock
      POSTGRES_USER: homestock
      POSTGRES_PASSWORD: "${HOMESTOCK_POSTGRES_PASSWORD:-changeme}"
    volumes:
      - homestock-postgres:/var/lib/postgresql/data
    # No ports published: the database is reachable only on the internal compose network.

volumes:
  homestock-data:
  homestock-postgres:
